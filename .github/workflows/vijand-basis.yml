name: Vijandbasis regressie

on:
  pull_request:
    paths:
      - "scripts/vijand_basis.gd"
      - "scripts/level.gd"
      - "scripts/data.gd"
      - "scripts/foliage.gd"
      - "scripts/vijand_hk.gd"
      - "scripts/vijand_hk_body.gd"
      - "scripts/main.gd"
      - "scripts/game.gd"
      - "scripts/aanval_routes.gd"
      - "scripts/hud.gd"
      - "scripts/hud_extra.gd"
      - "scripts/ally.gd"
      - "scripts/beleg.gd"
      - "scripts/team_commands.gd"
      - "scripts/team_command_controller.gd"
      - "scripts/touch_sticks.gd"
      - "scripts/combat_buttons.gd"
      - "tests/granaat_richten_test.gd"
      - "scripts/grote_kaart.gd"
      - "scripts/route.gd"
      - "assets/vijand_hk.glb"
      - "assets/vijand_m2_toren.glb"
      - "scripts/vijand_m2_toren.gd"
      - "scripts/jeep.gd"
      - "scripts/player.gd"
      - "scripts/camera_rig.gd"
      - "scripts/vijand_verdediger.gd"
      - "tests/jeep_m2_schutter_test.gd"
      - "tests/combat_feedback_test.gd"
      - "tests/combat_infantry_feedback_test.gd"
      - "tests/combat_bazooka_aim_test.gd"
      - "scripts/bazooka_aim_feedback.gd"
      - "scripts/player.gd"
      - "scripts/combat_target_hud.gd"
      - "scripts/combat_aim_feedback.gd"
      - "scripts/bullet.gd"
      - "tests/jeep_respawn_feedback_test.gd"
      - "scenes/vijand_verdediger.tscn"
      - "tests/vijand_m2_toren_test.gd"
      - "tests/vijand_m2_articulatie_test.gd"
      - "tests/vijand_basis_test.gd"
      - "tests/vijand_hk_test.gd"
      - "tests/aanval_basis_test.gd"
      - "tests/grote_kaart_test.gd"
      - "scripts/vijand_jeep.gd"
      - "assets/vijand_jeep.glb"
      - "tests/vijand_jeep_test.gd"
      - "scripts/vijand_tank.gd"
      - "assets/vijand_tank.glb"
      - "tests/vijand_tank_test.gd"
      - "scripts/voertuig_schade.gd"
      - "scripts/tank.gd"
      - "scripts/buildings.gd"
      - "scripts/enemy.gd"
      - "tests/voertuig_schade_test.gd"
      - "tests/rijden_vloeiend_test.gd"
      - "scripts/pause_menu.gd"
      - "scripts/progress.gd"
      - "scripts/mcv.gd"
      - "tests/test_groep_test.gd"
      - ".github/workflows/vijand-basis.yml"
  workflow_dispatch:

# Bij nieuwe commits slechts de nieuwste kandidaat testen.
concurrency:
  group: vijand-basis-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  vijandbasis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's release asset CDN occasionally responds with 504 during CI.
          # Both URLs are official Godot mirrors; retry each before aborting.
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 600 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o godot.zip || \
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 600 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o godot.zip
          test -s godot.zip
          unzip -tq godot.zip
          unzip -q godot.zip -d .godot-runner
          chmod +x .godot-runner/Godot_v4.7.2-stable_linux.x86_64
          .godot-runner/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import project
        run: timeout 900 .godot-runner/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import
      - name: Vijandbasis- en kaarttest
        shell: bash
        run: |
          set +e
          timeout 360 .godot-runner/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/vijand_basis_test.gd --fixed-fps 60 > "$RUNNER_TEMP/vijand.log" 2>&1
          RC=$?
          set -e
          echo "Godot exit code: $RC"
          grep -E 'FOUT|klaar, fouten|SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/vijand.log" | tail -n 40 || true
          tail -n 15 "$RUNNER_TEMP/vijand.log"
          exit "$RC"
      - name: M2HB visuele pivots en bemanning
        shell: bash
        run: |
          set -euo pipefail
          GODOT=.godot-runner/Godot_v4.7.2-stable_linux.x86_64
          timeout 120 "$GODOT" --headless --path . --script tests/vijand_m2_articulatie_test.gd
          timeout 120 "$GODOT" --headless --path . --script tests/vijand_m2_toren_test.gd --fixed-fps 60
      - name: Jeep MG versus torenschutter (echt kogelcontact en dekking)
        shell: bash
        run: |
          set -euo pipefail
          GODOT=.godot-runner/Godot_v4.7.2-stable_linux.x86_64
          timeout 180 "$GODOT" --headless --path . --script tests/jeep_m2_schutter_test.gd --fixed-fps 60
          timeout 180 "$GODOT" --headless --path . --script tests/combat_feedback_test.gd --fixed-fps 60
          timeout 180 "$GODOT" --headless --path . --script tests/combat_infantry_feedback_test.gd --fixed-fps 60
          timeout 180 "$GODOT" --headless --path . --script tests/combat_bazooka_aim_test.gd --fixed-fps 60
      - name: Granaat via rechterstick — echte iPhone touch events
        shell: bash
        run: |
          set -euo pipefail
          GODOT=.godot-runner/Godot_v4.7.2-stable_linux.x86_64
          timeout 360 "$GODOT" --headless --path . --script tests/granaat_richten_test.gd --fixed-fps 60 --quit-after 15000 2>&1 | tee "$RUNNER_TEMP/granaat_richten_test.log"
          grep -Fq "TEST OK" "$RUNNER_TEMP/granaat_richten_test.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|TEST MISLUKT' "$RUNNER_TEMP/granaat_richten_test.log"; then exit 1; fi
      - name: Jeep sterfte respawn en torenschutter trefeffecten
        shell: bash
        run: |
          set -euo pipefail
          GODOT=.godot-runner/Godot_v4.7.2-stable_linux.x86_64
          timeout 180 "$GODOT" --headless --path . --script tests/jeep_respawn_feedback_test.gd --fixed-fps 60
      - name: Bestaande speler respawn blijft werken
        shell: bash
        run: |
          set -euo pipefail
          GODOT=.godot-runner/Godot_v4.7.2-stable_linux.x86_64
          timeout 120 "$GODOT" --headless --path . --script tests/respawn_test.gd --fixed-fps 60
      - name: Bestaande voertuigwapens blijven werken
        shell: bash
        run: |
          set -euo pipefail
          GODOT=.godot-runner/Godot_v4.7.2-stable_linux.x86_64
          timeout 240 "$GODOT" --headless --path . --script tests/auto_wapens_test.gd --fixed-fps 60
      - name: Testoptie start bij groep
        shell: bash
        run: |
          set -euo pipefail
          timeout 300 .godot-runner/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/test_groep_test.gd --fixed-fps 60
      - name: Vijand-hoofdkwartier- en groepentest
        shell: bash
        run: |
          set +e
          timeout 360 .godot-runner/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/vijand_hk_test.gd --fixed-fps 60 > "$RUNNER_TEMP/vijand_hk.log" 2>&1
          RC=$?
          set -e
          echo "Godot exit code: $RC"
          grep -E 'FOUT|klaar, fouten|SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/vijand_hk.log" | tail -n 40 || true
          tail -n 15 "$RUNNER_TEMP/vijand_hk.log"
          exit "$RC"
      - name: Aanvallen op de vijandbasis (radar, teamwiel, mars)
        shell: bash
        run: |
          set +e
          timeout 600 .godot-runner/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/aanval_basis_test.gd --fixed-fps 60 > "$RUNNER_TEMP/aanval_basis.log" 2>&1
          RC=$?
          set -e
          echo "Godot exit code: $RC"
          grep -E 'FOUT|klaar, fouten|SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/aanval_basis.log" | tail -n 40 || true
          tail -n 15 "$RUNNER_TEMP/aanval_basis.log"
          exit "$RC"
      - name: Grote kaart en commandowiel boven je duim
        shell: bash
        run: |
          set +e
          timeout 300 .godot-runner/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/grote_kaart_test.gd --fixed-fps 60 > "$RUNNER_TEMP/grote_kaart.log" 2>&1
          RC=$?
          set -e
          echo "Godot exit code: $RC"
          grep -E 'FOUT|klaar, fouten|SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/grote_kaart.log" | tail -n 40 || true
          tail -n 15 "$RUNNER_TEMP/grote_kaart.log"
          exit "$RC"
      - name: Vijandelijke jeep (model, schade, wachtrij, schieten, rit over de brug)
        shell: bash
        run: |
          set +e
          timeout 900 .godot-runner/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/vijand_jeep_test.gd --fixed-fps 60 > "$RUNNER_TEMP/vijand_jeep.log" 2>&1
          RC=$?
          set -e
          echo "Godot exit code: $RC"
          grep -E 'FOUT|klaar, fouten|SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/vijand_jeep.log" | tail -n 40 || true
          tail -n 15 "$RUNNER_TEMP/vijand_jeep.log"
          exit "$RC"
      - name: Vijandelijke tank (model, schade, wachtrij, beleg met granaten, rit over de brug)
        shell: bash
        run: |
          set +e
          timeout 1200 .godot-runner/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/vijand_tank_test.gd --fixed-fps 60 > "$RUNNER_TEMP/vijand_tank.log" 2>&1
          RC=$?
          set -e
          echo "Godot exit code: $RC"
          grep -E 'FOUT|klaar, fouten|SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/vijand_tank.log" | tail -n 40 || true
          tail -n 15 "$RUNNER_TEMP/vijand_tank.log"
          exit "$RC"
      - name: Eigen voertuigen met levenspunten (schade van vijanden, meesterven, wrak, HUD-balk, vijanden schieten op lege voertuigen)
        shell: bash
        run: |
          set +e
          timeout 300 .godot-runner/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/voertuig_schade_test.gd --fixed-fps 60 > "$RUNNER_TEMP/voertuig_schade.log" 2>&1
          RC=$?
          set -e
          echo "Godot exit code: $RC"
          grep -E 'FOUT|klaar, fouten|SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/voertuig_schade.log" | tail -n 40 || true
          tail -n 15 "$RUNNER_TEMP/voertuig_schade.log"
          exit "$RC"
      - name: Jeep en tank rijden vloeiend (89 beelden per seconde tegen 60 natuurkundige tikken)
        shell: bash
        run: |
          set +e
          timeout 300 .godot-runner/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/rijden_vloeiend_test.gd --fixed-fps 89 > "$RUNNER_TEMP/rijden_vloeiend.log" 2>&1
          RC=$?
          set -e
          echo "Godot exit code: $RC"
          grep -E 'FOUT|klaar, fouten|SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/rijden_vloeiend.log" | tail -n 40 || true
          tail -n 15 "$RUNNER_TEMP/rijden_vloeiend.log"
          exit "$RC"
