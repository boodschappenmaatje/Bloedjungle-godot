name: Voorraadverkeer v185 regressie

on:
  push:
    branches:
      - feature/voorraad-traffic-v185
    paths:
      - "scripts/voorraad.gd"
      - "scripts/voorraad_truck.gd"
      - "tests/voorraad_verkeer_test.gd"
      - "tests/voorraad_verkeer_unit_test.gd"
      - "tests/voorraad_verkeer_fastsim_test.gd"
      - ".github/workflows/voorraad-verkeer-v185.yml"
  pull_request:
    paths:
      - "scripts/voorraad.gd"
      - "scripts/voorraad_truck.gd"
      - "tests/voorraad_verkeer_test.gd"
      - "tests/voorraad_verkeer_unit_test.gd"
      - "tests/voorraad_verkeer_fastsim_test.gd"
      - ".github/workflows/voorraad-verkeer-v185.yml"
  workflow_dispatch:

# Bij nieuwe fixes slechts de nieuwste kandidaat testen; branch-push en PR delen dezelfde groep.
concurrency:
  group: voorraad-v185-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verkeer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 30 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o godot.zip
          unzip -q godot.zip -d .godot-runner
          chmod +x .godot-runner/Godot_v4.7.2-stable_linux.x86_64
          .godot-runner/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import project
        run: timeout 900 .godot-runner/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import
      - name: Fast traffic FIFO and parking contract
        run: timeout 90 .godot-runner/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/voorraad_verkeer_unit_test.gd
      - name: Deterministic 240-second truck logic simulation
        shell: bash
        run: |
          set +e
          timeout 120 .godot-runner/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/voorraad_verkeer_fastsim_test.gd > "$RUNNER_TEMP/fastsim.log" 2>&1
          RC=$?
          set -e
          grep -E 'FOUT|OK |VERKEER_V185_FASTSIM_RESULT|SCRIPT ERROR|Parse Error|ERROR:' "$RUNNER_TEMP/fastsim.log" | tail -n 80 || true
          tail -n 25 "$RUNNER_TEMP/fastsim.log"
          exit "$RC"
      - name: Existing supply and driving regression
        run: |
          set -e
          for script in tests/voorraad_baan_test.gd tests/voorraad_test.gd; do
            timeout 360 .godot-runner/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "$script" --fixed-fps 60
          done
      - name: Six trucks, two depots, 30-second live-world smoke
        shell: bash
        run: |
          set +e
          timeout 240 .godot-runner/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/voorraad_verkeer_test.gd --fixed-fps 30 > "$RUNNER_TEMP/traffic.log" 2>&1
          RC=$?
          set -e
          echo "Godot exit code: $RC"
          echo "=== Test results and engine errors (last 100) ==="
          grep -E 'FOUT|VERKEER_V185_LIVE_RESULT|SCRIPT ERROR|Parse Error|ERROR:|Timed out' "$RUNNER_TEMP/traffic.log" | tail -n 100 || true
          echo "=== Last 60 log lines ==="
          tail -n 60 "$RUNNER_TEMP/traffic.log"
          exit "$RC"
