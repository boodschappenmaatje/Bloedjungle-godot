name: OTA update patch

# Bouwt na elke wijziging een patch (.pck) met alleen de bestanden die sinds de VORIGE patch zijn gewijzigd of toegevoegd (een keten),
# en zet die met een manifest in de GitHub-release "updates". De eerste patch na een nieuwe IPA (ota/basis.txt) vergelijkt met de IPA-commit,
# elke volgende met de commit van de vorige patch. De app downloadt alleen de patches die hij nog mist. De app (scripts/updater.gd) haalt ze op met een alleen-lezen token
# dat de gebruiker zelf invult. Er zijn geen extra secrets nodig: de ingebouwde GITHUB_TOKEN publiceert de release.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/updater.gd"
      - "scripts/update_panel.gd"
      - ".github/workflows/ota.yml"
  push:
    branches: [main, feature/native-ios-complete]
    paths-ignore: ["docs/**", "*.md"]

permissions:
  contents: write

concurrency:
  group: ota-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Install Godot 4.7.2 (Linux editor, same version as the iOS build)
        shell: bash
        run: |
          set -euo pipefail
          VERSION=4.7.2
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 30 --max-time 900 \
            "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip" --output "$RUNNER_TEMP/godot.zip"
          unzip -tq "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$(find "$RUNNER_TEMP/godot" -name 'Godot_v*' -type f -print -quit)"
          chmod +x "$GODOT"
          "$GODOT" --version | grep -F "${VERSION}.stable"
          echo "GODOT_BIN=$GODOT" >> "$GITHUB_ENV"
      - name: Work out the chain (what the previous patch already contains)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="$(tr -d '[:space:]' < ota/basis.txt)"
          test -n "$BASE"
          mkdir -p "$RUNNER_TEMP/prev"
          echo '[]' > "$RUNNER_TEMP/prev/keten.json"
          EXPORT_BASE="$BASE"
          if gh release download updates -p manifest.json -D "$RUNNER_TEMP/prev" --clobber 2>/dev/null; then
            python3 - "$BASE" "$RUNNER_TEMP/prev" "$GITHUB_SHA" > "$RUNNER_TEMP/prev/uitkomst.txt" <<'PY'
          import json, sys
          base, d, sha = sys.argv[1:4]
          m = json.load(open(d + "/manifest.json"))
          keten = m.get("patches") if m.get("schema") == 2 and m.get("base") == base else None
          if not keten:
              print("")
              sys.exit(0)
          # opnieuw draaien voor dezelfde commit: die patch zelf weglaten en vanaf zijn voorganger bouwen
          if keten[-1].get("commit") == sha:
              keten = keten[:-1]
          json.dump(keten, open(d + "/keten.json", "w"))
          print(keten[-1]["commit"] if keten else base)
          PY
            PREV="$(tr -d '[:space:]' < "$RUNNER_TEMP/prev/uitkomst.txt")"
            if [[ -n "$PREV" ]] && git cat-file -e "$PREV^{commit}" 2>/dev/null; then
              EXPORT_BASE="$PREV"
            else
              echo '[]' > "$RUNNER_TEMP/prev/keten.json"
            fi
          fi
          echo "Previous state: $EXPORT_BASE (chain has $(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))))" "$RUNNER_TEMP/prev/keten.json") patches)"
          echo "EXPORT_BASE=$EXPORT_BASE" >> "$GITHUB_ENV"
      - name: Export the base pack (the state the app has after the previous patch)
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$EXPORT_BASE^{commit}"
          git worktree add "$RUNNER_TEMP/basis" "$EXPORT_BASE"
          # dezelfde exportinstellingen als nu, zodat alleen echte inhoudsverschillen in de patch komen
          cp export_presets.cfg "$RUNNER_TEMP/basis/export_presets.cfg"
          cd "$RUNNER_TEMP/basis"
          "$GODOT_BIN" --headless --editor --path . --import || true
          "$GODOT_BIN" --headless --editor --path . --import
          "$GODOT_BIN" --headless --path . --export-pack "iOS" "$RUNNER_TEMP/base.pck"
          test -s "$RUNNER_TEMP/base.pck"
          ls -l "$RUNNER_TEMP/base.pck"
      - name: Export the patch (only files that differ from the previous state)
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(tr -d '[:space:]' < ota/basis.txt)"
          # Zelfde map en dezelfde importcache als de basis: een aparte map geeft voor elk model een ander
          # .scn en dan zit alles (13 MB) in de patch. Hier wisselt alleen de checkout van commit.
          cd "$RUNNER_TEMP/basis"
          git checkout --force --detach "$GITHUB_SHA"
          printf '{"base":"%s","commit":"%s","gebouwd":%s}\n' "$BASE" "$GITHUB_SHA" "$(date +%s)" > build_info.json
          "$GODOT_BIN" --headless --editor --path . --import || true
          "$GODOT_BIN" --headless --editor --path . --import
          # let op: --patches moet VOOR --export-patch staan
          "$GODOT_BIN" --headless --path . --patches "$RUNNER_TEMP/base.pck" --export-patch "iOS" "$RUNNER_TEMP/patch.pck"
          test -s "$RUNNER_TEMP/patch.pck"
          ls -l "$RUNNER_TEMP/patch.pck"
      - name: Prepare output folder
        shell: bash
        run: mkdir -p out
      - name: Write manifest
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(tr -d '[:space:]' < ota/basis.txt)"
          VERSIE="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          NAME="patch-${VERSIE}.pck"
          cp "$RUNNER_TEMP/patch.pck" "out/$NAME"
          python3 - "$NAME" "$VERSIE" "$BASE" "$RUNNER_TEMP/prev/keten.json" "$EXPORT_BASE" <<'PY'
          import hashlib, json, os, sys, time
          name, versie, base, keten_pad, vorige = sys.argv[1:6]
          path = os.path.join("out", name)
          data = open(path, "rb").read()
          nu = int(time.time())
          nieuw = {"naam": name, "grootte": len(data), "sha256": hashlib.sha256(data).hexdigest(),
                   "versie": versie, "commit": os.environ["GITHUB_SHA"], "vorige": vorige, "gebouwd": nu}
          keten = json.load(open(keten_pad)) + [nieuw]
          # pck blijft de laatste patch (zelfde veld als schema 1); patches is de hele keten sinds de IPA
          m = {"schema": 2, "versie": versie, "commit": os.environ["GITHUB_SHA"], "base": base, "gebouwd": nu,
               "pck": {"naam": name, "grootte": nieuw["grootte"], "sha256": nieuw["sha256"]}, "patches": keten}
          json.dump(m, open("out/manifest.json", "w"), indent=1)
          print(json.dumps(m, indent=1))
          totaal = sum(p["grootte"] for p in keten)
          print("Chain: %d patches, %.1f MB in total (a fresh install downloads all of it; new patch %.1f MB)" % (len(keten), totaal / 1048576, nieuw["grootte"] / 1048576))
          if totaal > 400 * 1048576:
              print("::warning::The patch chain is over 400 MB. Install a new IPA and set ota/basis.txt to its commit to start the chain from zero.")
          open("out/keten-namen.txt", "w").write("\n".join(p["naam"] for p in keten))
          PY
          echo "PATCH_NAME=$NAME" >> "$GITHUB_ENV"
      - name: Preview the staged OTA patch (PR only; never published)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ota-bootstrap-preview-${{ github.sha }}
          path: out/
          retention-days: 7
      - name: Publish to the "updates" release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view updates >/dev/null 2>&1 || gh release create updates --title "OTA updates" --notes "Automatisch gebouwd door .github/workflows/ota.yml. Niet handmatig wijzigen." --prerelease --target "$GITHUB_SHA"
          # eerst het patchbestand, dan pas het manifest: de app ziet nooit een manifest zonder bestand
          gh release upload updates "out/$PATCH_NAME" --clobber
          gh release upload updates out/manifest.json --clobber
          # patches die nog in de keten staan blijven; al het andere (oude cumulatieve patches, weesbestanden) gaat weg
          for n in $(gh release view updates --json assets -q '.assets[].name'); do
            if [[ "$n" == manifest.json ]] || grep -qxF "$n" out/keten-namen.txt; then continue; fi
            gh release delete-asset updates "$n" -y
          done
          gh release view updates --json assets -q '.assets[] | "\(.name)  \(.size) bytes"'
