name: MCV-start regressie

on:
  pull_request:
    paths:
      - "scripts/mcv.gd"
      - "scripts/main.gd"
      - "scripts/game.gd"
      - "scripts/data.gd"
      - "scripts/level.gd"
      - "scripts/base_props.gd"
      - "scripts/route.gd"
      - "scripts/enemy.gd"
      - "scripts/ally.gd"
      - "scripts/buildings.gd"
      - "scripts/foliage.gd"
      - "scripts/hud_extra.gd"
      - "scripts/hq_perks.gd"
      - "scripts/gates.gd"
      - "scripts/wachtpost.gd"
      - "scripts/generator.gd"
      - "scripts/patrouille.gd"
      - "scripts/build_mode.gd"
      - "scripts/pause_menu.gd"
      - "scripts/kampmuur.gd"
      - "scripts/wachten.gd"
      - "scripts/gate_body.gd"
      - "scripts/building_body.gd"
      - "scripts/voorraad.gd"
      - "scripts/voorraad_truck.gd"
      - "scripts/voorraad_verkeer.gd"
      - "tests/mcv_voorraad_test.gd"
      - "tests/mcv_draai_test.gd"
      - "tests/mcv_muur_test.gd"
      - "tests/mcv_muur_ui_test.gd"
      - "tests/mcv_poort_test.gd"
      - "tests/mcv_wacht_test.gd"
      - "tests/patrouille_test.gd"
      - "tests/mcv_kaarten_test.gd"
      - "tests/mcv_toren_test.gd"
      - "tests/poort_test.gd"
      - "tests/voorraad_test.gd"
      - "shaders/ground.gdshader"
      - "tests/mcv_test.gd"
      - "tests/respawn_test.gd"
      - ".github/workflows/mcv.yml"
  workflow_dispatch:

concurrency:
  group: mcv-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  mcv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 600 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o godot.zip || \
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 600 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o godot.zip || \
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 600 \
            "https://downloads.godotengine.org/?version=4.7.2&flavor=stable&slug=linux.x86_64.zip&platform=linux.64" \
            -o godot.zip
          test -s godot.zip
          unzip -tq godot.zip
          unzip -q godot.zip -d .godot-runner
          chmod +x .godot-runner/Godot_v4.7.2-stable_linux.x86_64
          .godot-runner/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import project
        run: timeout 900 .godot-runner/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import
      - name: MCV-start (wagen, uitklappen, hoofdkwartier, bomen weg, klok, vijand)
        shell: bash
        run: |
          set -euo pipefail
          GODOT=.godot-runner/Godot_v4.7.2-stable_linux.x86_64
          timeout 240 "$GODOT" --headless --path . --script tests/mcv_test.gd --fixed-fps 60 2>&1 | tee "$RUNNER_TEMP/mcv.log"
          grep -Fq "klaar, fouten: 0" "$RUNNER_TEMP/mcv.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|^FOUT' "$RUNNER_TEMP/mcv.log"; then exit 1; fi
      - name: MCV stap 2 (gratis depot, eerste truck, vrije route, rit levert geld)
        shell: bash
        run: |
          set -euo pipefail
          GODOT=.godot-runner/Godot_v4.7.2-stable_linux.x86_64
          timeout 300 "$GODOT" --headless --path . --script tests/mcv_voorraad_test.gd --fixed-fps 60 2>&1 | tee "$RUNNER_TEMP/mcv2.log"
          grep -Fq "klaar, fouten: 0" "$RUNNER_TEMP/mcv2.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|^FOUT' "$RUNNER_TEMP/mcv2.log"; then exit 1; fi
      - name: MCV hoofdkwartier draaien in het bouwscherm
        shell: bash
        run: |
          set -euo pipefail
          GODOT=.godot-runner/Godot_v4.7.2-stable_linux.x86_64
          timeout 200 "$GODOT" --headless --path . --script tests/mcv_draai_test.gd --fixed-fps 60 2>&1 | tee "$RUNNER_TEMP/mcv3.log"
          grep -Fq "klaar, fouten: 0" "$RUNNER_TEMP/mcv3.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|^FOUT' "$RUNNER_TEMP/mcv3.log"; then exit 1; fi
      - name: MCV bouwkaartjes volgen START MISSIE (Kampmuur, Poort, Wachttoren)
        shell: bash
        run: |
          set -euo pipefail
          GODOT=.godot-runner/Godot_v4.7.2-stable_linux.x86_64
          timeout 200 "$GODOT" --headless --path . --script tests/mcv_kaarten_test.gd --fixed-fps 60 2>&1 | tee "$RUNNER_TEMP/mcv8.log"
          grep -Fq "klaar, fouten: 0" "$RUNNER_TEMP/mcv8.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|^FOUT' "$RUNNER_TEMP/mcv8.log"; then exit 1; fi
      - name: MCV muren trekken (kosten, omheining, vijand slaat muur kapot)
        shell: bash
        run: |
          set -euo pipefail
          GODOT=.godot-runner/Godot_v4.7.2-stable_linux.x86_64
          timeout 300 "$GODOT" --headless --path . --script tests/mcv_muur_test.gd --fixed-fps 60 2>&1 | tee "$RUNNER_TEMP/mcv4.log"
          grep -Fq "klaar, fouten: 0" "$RUNNER_TEMP/mcv4.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|^FOUT' "$RUNNER_TEMP/mcv4.log"; then exit 1; fi
      - name: MCV muren trekken in het bouwscherm
        shell: bash
        run: |
          set -euo pipefail
          GODOT=.godot-runner/Godot_v4.7.2-stable_linux.x86_64
          timeout 300 "$GODOT" --headless --path . --script tests/mcv_muur_ui_test.gd --fixed-fps 60 2>&1 | tee "$RUNNER_TEMP/mcv5.log"
          grep -Fq "klaar, fouten: 0" "$RUNNER_TEMP/mcv5.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|^FOUT' "$RUNNER_TEMP/mcv5.log"; then exit 1; fi
      - name: MCV poort in de muur (plaatsen, trucks, vijanden)
        shell: bash
        run: |
          set -euo pipefail
          GODOT=.godot-runner/Godot_v4.7.2-stable_linux.x86_64
          timeout 400 "$GODOT" --headless --path . --script tests/mcv_poort_test.gd --fixed-fps 60 2>&1 | tee "$RUNNER_TEMP/mcv6.log"
          grep -Fq "klaar, fouten: 0" "$RUNNER_TEMP/mcv6.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|^FOUT' "$RUNNER_TEMP/mcv6.log"; then exit 1; fi
      - name: MCV wachten bij de kazerne (ronde langs de muur, naar de poort bij een aanval)
        shell: bash
        run: |
          set -euo pipefail
          GODOT=.godot-runner/Godot_v4.7.2-stable_linux.x86_64
          timeout 300 "$GODOT" --headless --path . --script tests/mcv_wacht_test.gd --fixed-fps 60 2>&1 | tee "$RUNNER_TEMP/mcv9.log"
          grep -Fq "klaar, fouten: 0" "$RUNNER_TEMP/mcv9.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|^FOUT' "$RUNNER_TEMP/mcv9.log"; then exit 1; fi
      - name: MCV wachttorens (4 gratis, klimmen)
        shell: bash
        run: |
          set -euo pipefail
          GODOT=.godot-runner/Godot_v4.7.2-stable_linux.x86_64
          timeout 200 "$GODOT" --headless --path . --script tests/mcv_toren_test.gd --fixed-fps 60 2>&1 | tee "$RUNNER_TEMP/mcv7.log"
          grep -Fq "klaar, fouten: 0" "$RUNNER_TEMP/mcv7.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|^FOUT' "$RUNNER_TEMP/mcv7.log"; then exit 1; fi
      - name: Oude poorten blijven werken (vast kamp)
        shell: bash
        run: |
          set -euo pipefail
          timeout 200 .godot-runner/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/poort_test.gd --fixed-fps 60
      - name: Oud voorraadsysteem blijft werken (vast kamp)
        shell: bash
        run: |
          set -euo pipefail
          timeout 400 .godot-runner/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/voorraad_test.gd --fixed-fps 60
      - name: Oud spel blijft werken (terugkomen bij de bunker)
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 .godot-runner/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/respawn_test.gd --fixed-fps 60
