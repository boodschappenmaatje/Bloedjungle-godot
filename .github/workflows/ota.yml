name: OTA update patch

# Bouwt na elke wijziging twee soorten updates en zet ze met een manifest in de GitHub-release "updates":
#  - LICHT: één patch met alle gewijzigde scripts, scènes en kleine bestanden sinds de IPA (ota/basis.txt). Klein; de app vervangt hem bij elke update.
#  - ZWAAR: een KETEN van patches met de gewijzigde modellen, texturen en geluiden (assets/**). Elk stuk bevat alleen wat er sinds het
#    vorige stuk veranderde; de eerste vergelijkt met de IPA. De app downloadt alleen de stukken die hij nog mist (scripts/update_panel.gd)
#    en laadt ze bij elke start (scripts/ota_keten.gd).
#  - BRUG: een piepkleine patch met alleen het nieuwe updatescherm, voor apps met de oude updater in de IPA (die geeft downloads maar 30 s).
# De splitsing staat in tools/ota_presets.py (twee extra exportpresets); zie ota/README.md.
# OTA publication trigger: approved Base Wall HQ2 berm fix (PR #236, merged as 461a31fa).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish verified OTA assets to the updates release"
        type: boolean
        required: true
        default: false
  pull_request:
    paths:
      - "scripts/**"
      - "assets/vijand_m2_toren.glb"
      - "tools/ota_*"
      - "tests/ota_*"
      - "export_presets.cfg"
      - ".github/workflows/ota.yml"
  push:
    branches: [main, feature/native-ios-complete]
    paths-ignore: ["docs/**", "*.md"]

permissions:
  contents: write

concurrency:
  group: ota-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Install Godot 4.7.2 (Linux editor, same version as the iOS build)
        shell: bash
        run: |
          set -euo pipefail
          VERSION=4.7.2
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 30 --max-time 900 \
            "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip" --output "$RUNNER_TEMP/godot.zip" || \
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 30 --max-time 900 \
            "https://downloads.godotengine.org/?version=${VERSION}&flavor=stable&slug=linux.x86_64.zip&platform=linux.64" --output "$RUNNER_TEMP/godot.zip"
          unzip -tq "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$(find "$RUNNER_TEMP/godot" -name 'Godot_v*' -type f -print -quit)"
          chmod +x "$GODOT"
          "$GODOT" --version | grep -F "${VERSION}.stable"
          echo "GODOT_BIN=$GODOT" >> "$GITHUB_ENV"
      - name: Work out the heavy chain (what the previous heavy piece already contains)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="$(tr -d '[:space:]' < ota/basis.txt)"
          test -n "$BASE"
          mkdir -p "$RUNNER_TEMP/prev"
          echo '[]' > "$RUNNER_TEMP/prev/keten.json"
          EXPORT_BASE="$BASE"
          if gh release download updates -p manifest.json -D "$RUNNER_TEMP/prev" --clobber 2>/dev/null; then
            gh release view updates --json assets -q '.assets[].name' > "$RUNNER_TEMP/prev/assets.txt"
            python3 - "$BASE" "$RUNNER_TEMP/prev" "$GITHUB_SHA" > "$RUNNER_TEMP/prev/uitkomst.txt" <<'PY'
          import json, sys
          base, d, sha = sys.argv[1:4]
          m = json.load(open(d + "/manifest.json"))
          keten = m.get("zwaar") if m.get("schema") == 3 and m.get("base") == base else None
          if not keten:
              print("")
              sys.exit(0)
          # stukken die in het manifest staan maar niet (meer) in de release: de keten stopt vóór het eerste ontbrekende stuk
          aanwezig = set(open(d + "/assets.txt").read().split())
          for i, p in enumerate(keten):
              if p["naam"] not in aanwezig:
                  keten = keten[:i]
                  break
          if not keten:
              print("")
              sys.exit(0)
          # opnieuw draaien voor dezelfde commit: dat stuk zelf weglaten en vanaf zijn voorganger bouwen
          if keten[-1].get("commit") == sha:
              keten = keten[:-1]
          json.dump(keten, open(d + "/keten.json", "w"))
          print(keten[-1]["commit"] if keten else base)
          PY
            PREV="$(tr -d '[:space:]' < "$RUNNER_TEMP/prev/uitkomst.txt")"
            if [[ -n "$PREV" ]] && git cat-file -e "$PREV^{commit}" 2>/dev/null; then
              EXPORT_BASE="$PREV"
            else
              echo '[]' > "$RUNNER_TEMP/prev/keten.json"
            fi
          fi
          # Zware bestanden die de scripts al bij het opstarten inladen (preload) kunnen niet via een vervolgstuk veranderen:
          # dan begint de zware keten opnieuw (één groot stuk).
          if [[ "$EXPORT_BASE" != "$BASE" ]]; then
            C0="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))[0]['commit'])" "$RUNNER_TEMP/prev/keten.json")"
            if python3 tools/ota_vroeg.py "$C0" "$GITHUB_SHA" --alleen-assets > "$RUNNER_TEMP/prev/vroeg.txt"; then :; else
              echo "::notice::Early-loaded assets changed since the chain started, starting a new heavy chain: $(tr '\n' ' ' < "$RUNNER_TEMP/prev/vroeg.txt")"
              echo '[]' > "$RUNNER_TEMP/prev/keten.json"
              EXPORT_BASE="$BASE"
            fi
          fi
          echo "Heavy chain continues from $EXPORT_BASE ($(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))))" "$RUNNER_TEMP/prev/keten.json") pieces so far)"
          echo "EXPORT_BASE=$EXPORT_BASE" >> "$GITHUB_ENV"
      - name: Export the base packs (light from the IPA commit, heavy from the previous heavy piece)
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(tr -d '[:space:]' < ota/basis.txt)"
          git worktree add "$RUNNER_TEMP/basis" "$BASE"
          W="$RUNNER_TEMP/basis"
          prep() {
            # dezelfde exportinstellingen als nu, plus de twee OTA-presets
            git -C "$W" checkout --force --detach "$1"
            cp export_presets.cfg "$W/export_presets.cfg"
            python3 tools/ota_presets.py "$W/export_presets.cfg"
            (cd "$W" && "$GODOT_BIN" --headless --editor --path . --import || true)
            (cd "$W" && "$GODOT_BIN" --headless --editor --path . --import)
          }
          prep "$BASE"
          (cd "$W" && "$GODOT_BIN" --headless --path . --export-pack "iOSlicht" "$RUNNER_TEMP/licht_base.pck")
          test -s "$RUNNER_TEMP/licht_base.pck"
          # De hele IPA-inhoud (zoals ios.yml die inpakt, met build_info.json) voor de simulatie hieronder; daarna weer weg zodat de basisstukken gelijk blijven.
          printf '{"base":"%s","commit":"%s","gebouwd":1}\n' "$BASE" "$BASE" > "$W/build_info.json"
          (cd "$W" && "$GODOT_BIN" --headless --path . --export-pack "iOS" "$RUNNER_TEMP/sim_ios.pck")
          rm -f "$W/build_info.json"
          test -s "$RUNNER_TEMP/sim_ios.pck"
          if [[ "$EXPORT_BASE" != "$BASE" ]]; then prep "$EXPORT_BASE"; fi
          (cd "$W" && "$GODOT_BIN" --headless --path . --export-pack "iOSzwaar" "$RUNNER_TEMP/zwaar_base.pck")
          test -s "$RUNNER_TEMP/zwaar_base.pck"
          ls -l "$RUNNER_TEMP"/*.pck
      - name: Export the patches (light since the IPA, heavy since the previous heavy piece)
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(tr -d '[:space:]' < ota/basis.txt)"
          W="$RUNNER_TEMP/basis"
          # Zelfde map en dezelfde importcache als de basis: een aparte map geeft voor elk model een ander
          # .scn en dan zit alles (13 MB) in de patch. Hier wisselt alleen de checkout van commit.
          git -C "$W" checkout --force --detach "$GITHUB_SHA"
          cp export_presets.cfg "$W/export_presets.cfg"
          python3 tools/ota_presets.py "$W/export_presets.cfg"
          printf '{"base":"%s","commit":"%s","gebouwd":%s}\n' "$BASE" "$GITHUB_SHA" "$(date +%s)" > "$W/build_info.json"
          cd "$W"
          "$GODOT_BIN" --headless --editor --path . --import || true
          "$GODOT_BIN" --headless --editor --path . --import
          # let op: --patches moet VOOR --export-patch staan
          "$GODOT_BIN" --headless --path . --patches "$RUNNER_TEMP/licht_base.pck" --export-patch "iOSlicht" "$RUNNER_TEMP/licht.pck"
          "$GODOT_BIN" --headless --path . --patches "$RUNNER_TEMP/zwaar_base.pck" --export-patch "iOSzwaar" "$RUNNER_TEMP/zwaar.pck"
          test -s "$RUNNER_TEMP/licht.pck"
          test -s "$RUNNER_TEMP/zwaar.pck"
          # alle zware bestanden van deze commit: wat de telefoon na de hele keten heeft (alleen voor de simulatie)
          "$GODOT_BIN" --headless --path . --export-pack "iOSzwaar" "$RUNNER_TEMP/zwaar_voll.pck"
          # De brug: alleen het gecompileerde updatescherm uit het lichte stuk (voor apps met de oude updater uit de IPA).
          "$GODOT_BIN" --headless --path . -s tools/make_ota_bootstrap.gd -- "$RUNNER_TEMP/licht.pck" "$RUNNER_TEMP/brug.pck"
          BYTES="$(stat -c %s "$RUNNER_TEMP/brug.pck")"
          if (( BYTES > 10485760 )); then echo "The bridge must be <10 MB, got $BYTES" >&2; exit 1; fi
          ls -l "$RUNNER_TEMP"/*.pck
      - name: Safety net - start the app with these OTA files (a broken update is never published)
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(tr -d '[:space:]' < ota/basis.txt)"
          # 1) statische regel: geen zware bestanden met preload in de scripts die bij het opstarten compileren (tests/ota_vroeg_test.gd)
          (cd "$RUNNER_TEMP/basis" && "$GODOT_BIN" --headless --path . -s tests/ota_vroeg_test.gd)
          # 2) de app nabootsen: IPA-basis + lichte patch + alle zware bestanden; de speler moet een zichtbaar model hebben (tools/ota_simulatie.sh)
          OTA_BASE="$BASE" OTA_WERKMAP="$RUNNER_TEMP/sim" tools/ota_simulatie.sh "$GODOT_BIN" "$RUNNER_TEMP/sim_ios.pck" "$RUNNER_TEMP/licht.pck" "$RUNNER_TEMP/zwaar_voll.pck"
          # 3) de brug nabootsen: IPA-basis + alleen brug.pck. Het updatescherm moet daar laden, anders kom je niet meer in het updatemenu
          #    (tools/ota_brug_simulatie.sh; precies dit ging mis in v174)
          OTA_BASE="$BASE" OTA_WERKMAP="$RUNNER_TEMP/sim_brug" tools/ota_brug_simulatie.sh "$GODOT_BIN" "$RUNNER_TEMP/sim_ios.pck" "$RUNNER_TEMP/brug.pck"
          rm -rf "$RUNNER_TEMP/sim" "$RUNNER_TEMP/sim_brug" "$RUNNER_TEMP/zwaar_voll.pck" "$RUNNER_TEMP/sim_ios.pck"
      - name: Write manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          BASE="$(tr -d '[:space:]' < ota/basis.txt)"
          VERSIE="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          python3 - "$VERSIE" "$BASE" "$RUNNER_TEMP" "$EXPORT_BASE" <<'PY'
          import hashlib, json, os, shutil, sys, time
          versie, base, tmp, vorige = sys.argv[1:5]
          nu = int(time.time())
          def entry(bron, naam, **extra):
              data = open(bron, "rb").read()
              shutil.copy(bron, os.path.join("out", naam))
              d = {"naam": naam, "grootte": len(data), "sha256": hashlib.sha256(data).hexdigest()}
              d.update(extra)
              return d
          brug = entry(tmp + "/brug.pck", "brug-%s.pck" % versie)
          licht = entry(tmp + "/licht.pck", "licht-%s.pck" % versie, versie=versie, commit=os.environ["GITHUB_SHA"], gebouwd=nu)
          keten = json.load(open(tmp + "/prev/keten.json"))
          zwaar_grootte = os.path.getsize(tmp + "/zwaar.pck")
          if zwaar_grootte > 64 * 1024 or not keten:
              # een (bijna) lege zware patch laten we weg: de volgende vergelijkt dan met de commit van het laatste stuk
              keten.append(entry(tmp + "/zwaar.pck", "zwaar-%s.pck" % versie, versie=versie, commit=os.environ["GITHUB_SHA"], vorige=vorige, gebouwd=nu))
          m = {"schema": 3, "versie": versie, "commit": os.environ["GITHUB_SHA"], "base": base, "gebouwd": nu, "pck": brug, "licht": licht, "zwaar": keten}
          json.dump(m, open("out/manifest.json", "w"), indent=1)
          print(json.dumps(m, indent=1))
          mb = lambda b: b / 1048576
          zw = sum(p["grootte"] for p in keten)
          print("Light %.1f MB (replaced each update), heavy chain %d pieces %.1f MB in total, bridge %.2f MB" % (mb(licht["grootte"]), len(keten), mb(zw), mb(brug["grootte"])))
          with open("out/namen.txt", "w") as f:
              f.write("\n".join([brug["naam"], licht["naam"]] + [p["naam"] for p in keten]) + "\n")
          PY
      - name: Preview the OTA files (PR only; never published)
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.publish)
        uses: actions/upload-artifact@v4
        with:
          name: ota-preview-${{ github.sha }}
          path: out/
          retention-days: 7
      - name: Publish to the "updates" release
        if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip-ota-publish]')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view updates >/dev/null 2>&1 || gh release create updates --title "OTA updates" --notes "Automatisch gebouwd door .github/workflows/ota.yml. Niet handmatig wijzigen." --prerelease --target "$GITHUB_SHA"
          # eerst de patchbestanden (alleen wat nog niet in de release staat), dan pas het manifest: de app ziet nooit een manifest zonder bestanden
          BESTAAT="$(gh release view updates --json assets -q '.assets[].name')"
          while read -r n || [[ -n "$n" ]]; do
            if grep -qxF "$n" <<< "$BESTAAT"; then continue; fi
            gh release upload updates "out/$n" --clobber
          done < out/namen.txt
          gh release upload updates out/manifest.json --clobber
          # wat niet meer in het manifest staat (oude lichte stukken, bruggen, losse resten) gaat weg
          for n in $(gh release view updates --json assets -q '.assets[].name'); do
            if [[ "$n" == manifest.json ]] || grep -qxF "$n" out/namen.txt; then continue; fi
            gh release delete-asset updates "$n" -y
          done
          gh release view updates --json assets -q '.assets[] | "\(.name)  \(.size) bytes"'
