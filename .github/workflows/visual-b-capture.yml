name: Visual Upgrade B Godot captures

on:
  pull_request:
    branches: [main]
    paths:
      - "assets/textures/terrain/**"
      - "assets/textures/foliage/depth_pass/**"
      - "assets/textures/foliage/polyhaven/**"
      - "assets/jungle_depth_foliage.glb"
      - "bron/jungle_foliage_depth/**"
      - "scripts/atmosphere.gd"
      - "scripts/foliage.gd"
      - "scripts/grass_field.gd"
      - "scripts/jungle_understory.gd"
      - "scripts/level.gd"
      - "shaders/foliage.gdshader"
      - "shaders/foliage_depth_pbr.gdshader"
      - "shaders/grass_3d.gdshader"
      - "shaders/ground.gdshader"
      - "shaders/water.gdshader"
      - "tests/visual_b_capture.gd"
      - "tests/visual_b_test.tscn"
      - "tests/visual_b_test.gd"
      - ".github/workflows/visual-b-capture.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --version | grep -F "4.7.2.stable"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Install Mesa software Vulkan for the Mobile renderer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers vulkan-tools
          if [[ -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json ]]; then
            echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json" >> "$GITHUB_ENV"
          fi
          if ! vulkaninfo --summary > "$RUNNER_TEMP/vulkan-summary.log" 2>&1; then
            echo "Mesa Vulkan is unavailable on this runner; the capture log will record Godot's real fallback renderer."
          fi
      - name: Import project and retain diagnostics
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --import 2>&1 | tee "$RUNNER_TEMP/visual-b-import.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|SHADER ERROR:|Shader compilation failed' "$RUNNER_TEMP/visual-b-import.log"; then exit 1; fi
      - name: Run visual B terrain and foliage integration test
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --fixed-fps 60 res://tests/visual_b_test.tscn \
            2>&1 | tee "$RUNNER_TEMP/visual-b-test.log"
          grep -Fq "VISUAL B TEST PASS" "$RUNNER_TEMP/visual-b-test.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|SHADER ERROR:|Shader compilation failed' "$RUNNER_TEMP/visual-b-test.log"; then exit 1; fi
      - name: Select quick preview mode
        id: capture_mode
        shell: bash
        run: |
          if [[ -f .github/visual_b_quick_preview ]]; then
            echo "quick=true" >> "$GITHUB_OUTPUT"
          else
            echo "quick=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Capture one fast, real main-camera preview
        if: steps.capture_mode.outputs.quick == 'true'
        timeout-minutes: 18
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/visual-b-quick"
          xvfb-run -a -s "-screen 0 1280x720x24" env \
            GODOT_SILENCE_ROOT_WARNING=1 BJ_INSTANT=1 BJ_TOUCH=1 BJ_RENDER_SCALE=1.0 \
            BJ_CAPTURE_QUALITY=high BJ_CAPTURE_SPOT=rivier BJ_CAPTURE_ONLY=1 \
            BJ_B_OUT="$RUNNER_TEMP/visual-b-quick" \
            "$GODOT_BIN" --path . -s tests/visual_b_capture.gd --resolution 1280x720 \
            2>&1 | tee "$RUNNER_TEMP/visual-b-capture-quick.log"
          grep -Fq "VISUAL B CAPTURE PASS" "$RUNNER_TEMP/visual-b-capture-quick.log"
          grep -Fq "CAPTURE RENDERER " "$RUNNER_TEMP/visual-b-capture-quick.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|SHADER ERROR:|Shader compilation failed' "$RUNNER_TEMP/visual-b-capture-quick.log"; then exit 1; fi
      - name: Capture real main-scene camera at benchmark settings
        if: steps.capture_mode.outputs.quick != 'true'
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/visual-b-60" "$RUNNER_TEMP/visual-b-100"
          xvfb-run -a -s "-screen 0 1280x720x24" env \
            GODOT_SILENCE_ROOT_WARNING=1 BJ_INSTANT=1 BJ_TOUCH=1 BJ_RENDER_SCALE=0.6 \
            BJ_CAPTURE_QUALITY=high BJ_B_OUT="$RUNNER_TEMP/visual-b-60" \
            "$GODOT_BIN" --path . -s tests/visual_b_capture.gd --resolution 1280x720 \
            2>&1 | tee "$RUNNER_TEMP/visual-b-capture-60.log"
          grep -Fq "VISUAL B CAPTURE PASS" "$RUNNER_TEMP/visual-b-capture-60.log"
          grep -Fq "CAPTURE RENDERER " "$RUNNER_TEMP/visual-b-capture-60.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|SHADER ERROR:|Shader compilation failed' "$RUNNER_TEMP/visual-b-capture-60.log"; then exit 1; fi
          xvfb-run -a -s "-screen 0 1280x720x24" env \
            GODOT_SILENCE_ROOT_WARNING=1 BJ_INSTANT=1 BJ_TOUCH=1 BJ_RENDER_SCALE=1.0 \
            BJ_CAPTURE_QUALITY=high BJ_CAPTURE_SPOT=bospad BJ_CAPTURE_ONLY=1 \
            BJ_B_OUT="$RUNNER_TEMP/visual-b-100" \
            "$GODOT_BIN" --path . -s tests/visual_b_capture.gd --resolution 1280x720 \
            2>&1 | tee "$RUNNER_TEMP/visual-b-capture-100.log"
          grep -Fq "VISUAL B CAPTURE PASS" "$RUNNER_TEMP/visual-b-capture-100.log"
          grep -Fq "CAPTURE RENDERER " "$RUNNER_TEMP/visual-b-capture-100.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|SHADER ERROR:|Shader compilation failed' "$RUNNER_TEMP/visual-b-capture-100.log"; then exit 1; fi
      - name: Upload Godot captures and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-upgrade-b-godot-${{ github.sha }}
          path: |
            ${{ runner.temp }}/visual-b-60
            ${{ runner.temp }}/visual-b-100
            ${{ runner.temp }}/visual-b-quick
            ${{ runner.temp }}/visual-b-import.log
            ${{ runner.temp }}/visual-b-test.log
            ${{ runner.temp }}/visual-b-capture-quick.log
            ${{ runner.temp }}/visual-b-capture-60.log
            ${{ runner.temp }}/visual-b-capture-100.log
            ${{ runner.temp }}/vulkan-summary.log
          if-no-files-found: warn
          retention-days: 14
